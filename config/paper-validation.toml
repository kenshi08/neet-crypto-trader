# Paper-validation config — multi-exchange paper trading for validation.
#
# All exchanges in demo/testnet mode (set *_DEMO_MODE=true in .env).
# Validate the quant stack before deploying real money.
#
# Duration: 2 weeks minimum. Monitor via Telegram.
# Go/No-Go: win rate > 50%, max drawdown < 10%, zero barrier failures.

[trading]
pairs = ["BTC-USDT", "ETH-USDT", "SOL-USDT"]
strategy = "composite"
timeframe = "15m"
max_open_positions = 6
poll_interval_seconds = 15
reconciliation_interval = 10

[budget]
period = "weekly"
amount_usdt = 500
max_loss_pct = 5.0
max_gain_pct = 15.0
max_position_pct = 25.0
daily_loss_limit_usdt = 50

[risk]
stop_loss_pct = 3.0
take_profit_pct = 5.0
time_limit_seconds = 3600
trailing_stop = true
trailing_stop_activation_pct = 2.0
trailing_stop_delta_pct = 1.0
breakeven_trigger_pct = 1.5
min_signal_confidence = 0.6
exchange_fee_pct = 0.1
max_correlated_positions = 2
volatility_circuit_breaker_multiplier = 2.5
volatility_lookback_candles = 20

[market_selection]
min_volume_usdt = 50000
max_spread_pct = 0.5

[telegram]
min_severity = "low"

[strategy.composite]
pe_threshold = 0.90
no_trade_threshold = 0.55
full_size_threshold = 0.70
llm_enabled = true

# --- Multi-exchange paper portfolios ---

[[portfolios]]
exchange = "hyperliquid"
pairs = ["BTC-USDT", "ETH-USDT"]
quote_currency = "USDC"
budget_amount = 200
max_positions = 2

[[portfolios]]
exchange = "okx"
pairs = ["BTC-USDT", "ETH-USDT", "SOL-USDT"]
quote_currency = "USDT"
budget_amount = 175
max_positions = 2

[[portfolios]]
exchange = "coinbase"
pairs = ["BTC-USDC", "ETH-USDC"]
quote_currency = "USDC"
budget_amount = 125
max_positions = 2
