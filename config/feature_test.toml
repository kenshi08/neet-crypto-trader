# Feature test config — exercises all Phase 7-12 features on Coinbase demo.
# Designed to generate 5-15 trades/day for meaningful analytics over 3-5 days.
# DO NOT use on a live account.

[trading]
pairs = ["BTC-USD", "ETH-USD", "SOL-USD"]
strategy = "momentum"
timeframe = "5m"                    # 5-min candles — faster signals than 15m, less noise than 1m
max_open_positions = 2              # Allow 2 simultaneous — tests correlation limits
poll_interval_seconds = 15
reconciliation_interval = 5         # Check barriers + reconcile every 5 iterations (~75s)

[budget]
period = "weekly"
amount_usdt = 200                   # Small test budget
max_loss_pct = 15.0                 # Generous for testing — 15% of $200 = $30
max_gain_pct = 30.0                 # Let winners run during test
max_position_pct = 40.0             # Up to $80 per trade
daily_loss_limit_usdt = 30
daily_notional_cap_usdt = 500       # Tests daily notional cap — $500/day

[risk]
stop_loss_pct = 1.5                 # Tight SL — exits fast, generates more trade data
take_profit_pct = 2.5               # 1.67:1 reward/risk
time_limit_seconds = 900            # 15-minute time limit — forces exits

# Trailing stop — tests Phase 12
trailing_stop = true
trailing_stop_activation_pct = 1.0  # Activate trailing after +1%
trailing_stop_delta_pct = 0.5       # Trail 0.5% behind high

# Breakeven — tests Phase 12
breakeven_trigger_pct = 0.8         # Move SL to breakeven at +0.8%

# Partial profit taking — tests Phase 12
[[risk.partial_tp]]
pct = 1.5                           # Close 50% at +1.5%
close_fraction = 0.5

min_signal_confidence = 0.2         # Low bar — accept more signals for testing

# Correlation limits — tests Phase 10
max_correlated_positions = 1        # Only 1 from btc_beta group at a time
[risk.correlation_groups]
btc_beta = ["BTC-USD", "ETH-USD", "SOL-USD"]

# Volatility circuit breaker — tests Phase 10
volatility_circuit_breaker_multiplier = 3.0  # Halt if ATR > 3x median
volatility_lookback_candles = 20
volatility_reference_pair = "BTC-USD"

[market_selection]
min_volume_usdt = 10000             # Filter very low volume (unlikely on BTC/ETH/SOL)
max_spread_pct = 1.0                # Skip if spread > 1%
blacklist = []

[telegram]
min_severity = "low"                # See everything during test
quiet_hours_start = 23              # Quiet 11pm-7am Singapore time
quiet_hours_end = 7
quiet_hours_timezone = "Asia/Singapore"
quiet_hours_min_severity = "high"   # Only high/critical during quiet hours

[strategy.momentum]
rsi_period = 10                     # Faster RSI for 5m candles
rsi_oversold = 38.0                 # Slightly wider than default — more signals
rsi_overbought = 62.0
macd_fast = 8                       # Faster MACD for 5m
macd_slow = 17
macd_signal = 6
