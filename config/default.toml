[trading]
pairs = ["BTC-USDT", "ETH-USDT", "SOL-USDT"]
strategy = "composite"          # "composite" = full quant stack, "momentum"/"mean_reversion" etc. = single TA
timeframe = "15m"
max_open_positions = 3
poll_interval_seconds = 10
reconciliation_interval = 10    # Run reconciliation + barrier checks every N iterations

[budget]
period = "weekly"               # "weekly" or "monthly"
amount_usdt = 500               # Capital to deploy per period
max_loss_pct = 5.0              # Stop trading at -5% of budget
max_gain_pct = 15.0             # Take profits at +15% of budget
max_position_pct = 20.0         # Max 20% of budget per single trade
daily_loss_limit_usdt = 100     # Hard stop for the day
daily_notional_cap_usdt = 0     # Max notional per day, 0 = disabled

[risk]
stop_loss_pct = 3.0             # Per-trade stop-loss
take_profit_pct = 5.0           # Per-trade take-profit
time_limit_seconds = 3600       # Close position after 1 hour if no SL/TP hit
trailing_stop = false
trailing_stop_activation_pct = 2.0  # Activate trailing after +2% unrealized
trailing_stop_delta_pct = 1.0       # Trail 1% behind high-water mark
breakeven_trigger_pct = 0           # Move SL to breakeven at +N%, 0 = disabled
min_signal_confidence = 0.6     # Minimum strategy confidence to enter a trade
exchange_fee_pct = 0.1          # Per-side fee: 0.4 Coinbase, 0.1 OKX/Bybit, 0.045 Hyperliquid

# Partial profit taking — close fractions at intermediate targets
# [[risk.partial_tp]]
# pct = 3.0           # trigger at +3%
# close_fraction = 0.5  # close 50% of position
max_correlated_positions = 2    # Max positions from same correlation group
volatility_circuit_breaker_multiplier = 0.0  # 0 = disabled; e.g. 3.0 = halt if ATR > 3x median
volatility_lookback_candles = 20
volatility_reference_pair = ""  # e.g. "BTC-USD" — leave empty to disable

[risk.correlation_groups]
# btc_beta = ["BTC-USD", "ETH-USD", "SOL-USD"]

[market_selection]
min_volume_usdt = 0             # Min 24h volume in USDT, 0 = disabled
max_spread_pct = 0              # Max bid-ask spread %, 0 = disabled
blacklist = []                  # Pairs to never trade

[telegram]
min_severity = "low"                # minimum severity to send: low, medium, high, critical
quiet_hours_start = -1              # hour 0-23 (-1 = disabled)
quiet_hours_end = -1
quiet_hours_timezone = "UTC"
quiet_hours_min_severity = "critical"  # only critical alerts during quiet hours

# Strategy-specific parameters under [strategy.<name>].
# The active section is whichever matches `trading.strategy` above.

[strategy.momentum]
rsi_period = 14
rsi_oversold = 30.0             # RSI below this = oversold (buy signal)
rsi_overbought = 70.0           # RSI above this = overbought (sell signal)
macd_fast = 12
macd_slow = 26
macd_signal = 9

[strategy.mean_reversion]
bb_period = 20                  # Bollinger Bands lookback period
bb_std = 2.0                    # Standard deviations for band width
volume_ma_period = 20           # Volume moving average period
volume_multiplier = 1.2         # Volume must exceed avg * this for signal
atr_period = 14
atr_sl_multiplier = 1.5
atr_tp_multiplier = 2.0

[strategy.trend_following]
ema_fast = 9                    # Fast EMA period
ema_slow = 21                   # Slow EMA period
adx_period = 14                 # ADX lookback period
adx_threshold = 25.0            # Min ADX to confirm trend (0-100)
atr_period = 14
atr_sl_multiplier = 2.0         # Wider stop for trend trades
atr_tp_multiplier = 3.0         # Larger target — let trends run

[strategy.volatility_breakout]
lookback_period = 20            # N-period high/low range
atr_period = 14
breakout_atr_multiplier = 0.5   # Min breakout distance as ATR multiple
atr_sl_multiplier = 1.0         # Tight stop — quick exit on failed breakout
atr_tp_multiplier = 2.0

# Composite strategy — 8-layer quant alpha engine.
# Set trading.strategy = "composite" to activate.
# Falls back to base TA + entropy filter when meta-model is not trained.
[strategy.composite]
# Runs all 4 TA strategies (momentum, mean_reversion, trend_following,
# volatility_breakout) as feature generators for the XGBoost meta-model.
pe_threshold = 0.90             # Permutation entropy: block trades above this (market too random)
pe_window = 50                  # Rolling window for PE computation
pe_order = 5                    # Embedding dimension (5 = 120 ordinal patterns)
bocpd_hazard_rate = 0.004       # BOCPD: expected changepoint frequency (~1/250 candles)
# Meta-model loads from data/models/meta_model.json (written by auto_pipeline.py)
no_trade_threshold = 0.55       # Meta-model P(profitable) below this = no trade
full_size_threshold = 0.70      # Meta-model P(profitable) above this = full position
llm_enabled = true              # LLM consultative signal: adjusts confidence during regime conflicts
llm_model = "claude-haiku-4-5-20251001"  # Fast + cheap (~$0.001/call)
llm_max_calls_per_hour = 30     # Rate limit for LLM API calls

# Pairs Kalman strategy — statistical arbitrage on cointegrated pairs.
# Set trading.strategy = "pairs_kalman" to activate.
[strategy.pairs_kalman]
pair_b = "ETH-USDT"            # Secondary pair for spread computation
entry_zscore = 2.0              # Enter when spread z-score exceeds this
exit_zscore = 0.5               # Exit when spread z-score returns to this
lookback = 50                   # Rolling window for z-score computation
delta = 0.0001                  # Kalman process noise (how fast hedge ratio adapts)
min_half_life = 2.0             # Min OU half-life to confirm mean-reversion
max_half_life = 100.0           # Max OU half-life (above = not mean-reverting)

