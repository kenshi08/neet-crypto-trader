# Live-reduced config — minimal budget for graduated live deployment.
#
# Graduation plan:
#   Week 1-2: This config ($100/week total across 3 exchanges)
#   Week 3-4: Increase to live-conservative ($300/week)
#   Week 5+:  Scale based on validated performance

[trading]
pairs = ["BTC-USDT", "ETH-USDT"]
strategy = "composite"
timeframe = "15m"
max_open_positions = 3
poll_interval_seconds = 15
reconciliation_interval = 10

[budget]
period = "weekly"
amount_usdt = 100
max_loss_pct = 5.0
max_gain_pct = 15.0
max_position_pct = 25.0
daily_loss_limit_usdt = 15

[risk]
stop_loss_pct = 2.5
take_profit_pct = 4.0
time_limit_seconds = 3600
trailing_stop = true
trailing_stop_activation_pct = 2.0
trailing_stop_delta_pct = 1.0
breakeven_trigger_pct = 1.5
min_signal_confidence = 0.6
exchange_fee_pct = 0.1
max_correlated_positions = 1
volatility_circuit_breaker_multiplier = 2.5
volatility_lookback_candles = 20

[market_selection]
min_volume_usdt = 100000
max_spread_pct = 0.5

[telegram]
min_severity = "low"

[strategy.composite]
pe_threshold = 0.90
no_trade_threshold = 0.55
full_size_threshold = 0.70
llm_enabled = true

# --- Multi-exchange live portfolios (minimal budget) ---

[[portfolios]]
exchange = "hyperliquid"
pairs = ["BTC-USDT", "ETH-USDT"]
quote_currency = "USDC"
budget_amount = 40
max_positions = 1

[[portfolios]]
exchange = "okx"
pairs = ["BTC-USDT", "ETH-USDT"]
quote_currency = "USDT"
budget_amount = 35
max_positions = 1

[[portfolios]]
exchange = "coinbase"
pairs = ["BTC-USDC", "ETH-USDC"]
quote_currency = "USDC"
budget_amount = 25
max_positions = 1
