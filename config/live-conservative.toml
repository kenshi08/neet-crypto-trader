# Live-conservative config — safe defaults for real money deployment.
# All protections enabled, conservative limits.
#
# Set all *_DEMO_MODE=false in .env before using this.
# Use NCT_CONFIG=config/live-conservative.toml in .env.

[trading]
pairs = ["BTC-USDT", "ETH-USDT", "SOL-USDT"]
strategy = "composite"
timeframe = "15m"
max_open_positions = 4
poll_interval_seconds = 15
reconciliation_interval = 10

[budget]
period = "weekly"
amount_usdt = 300
max_loss_pct = 3.0
max_gain_pct = 10.0
max_position_pct = 20.0
daily_loss_limit_usdt = 30

[risk]
stop_loss_pct = 2.5
take_profit_pct = 4.0
time_limit_seconds = 3600
trailing_stop = true
trailing_stop_activation_pct = 2.0
trailing_stop_delta_pct = 0.8
breakeven_trigger_pct = 1.5
min_signal_confidence = 0.65
exchange_fee_pct = 0.1
max_correlated_positions = 1
volatility_circuit_breaker_multiplier = 2.5
volatility_lookback_candles = 20

[[risk.partial_tp]]
pct = 2.5
close_fraction = 0.4

[risk.correlation_groups]
btc_ecosystem = ["BTC-USDT", "ETH-USDT", "SOL-USDT", "BTC-USD", "ETH-USD"]

[market_selection]
min_volume_usdt = 100000
max_spread_pct = 0.5

[telegram]
min_severity = "low"

[strategy.composite]
pe_threshold = 0.88
no_trade_threshold = 0.58
full_size_threshold = 0.72
llm_enabled = true

# --- Multi-exchange live portfolios ---

[[portfolios]]
exchange = "hyperliquid"
pairs = ["BTC-USDT", "ETH-USDT"]
quote_currency = "USDC"
budget_amount = 120
max_positions = 2

[[portfolios]]
exchange = "okx"
pairs = ["BTC-USDT", "ETH-USDT", "SOL-USDT"]
quote_currency = "USDT"
budget_amount = 100
max_positions = 2

[[portfolios]]
exchange = "coinbase"
pairs = ["BTC-USDC", "ETH-USDC"]
quote_currency = "USDC"
budget_amount = 80
max_positions = 1
