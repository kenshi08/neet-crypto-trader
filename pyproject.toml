[project]
name = "neet-crypto-trader"
version = "0.1.0"
description = "Crypto trading agent for OKX with budget-controlled short-term speculation"
requires-python = ">=3.11"
dependencies = [
    "python-okx>=0.3,<1",
    "pandas>=2.1,<3",
    "ta>=0.11,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.0,<26",
    "aiolimiter>=1.1,<2",
    "aiosqlite>=0.20,<1",
    "python-dotenv>=1.0,<2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
]

[project.scripts]
nct = "nct.main:cli_entry"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that use real SQLite or external services",
    "slow: long-running tests (backtesting, etc.)",
]
